name: Build Jekyll site

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
      - name: Build site
        run: bundle exec jekyll build --strict_front_matter
        env:
          JEKYLL_ENV: production
      - name: Verify rendered content
        run: |
          grep -q "Junteng Liu" _site/index.html
          grep -q "First-year PhD candidate at HKUST NLP Group" _site/index.html
          grep -q "MINIMAX" _site/index.html
          grep -q "Zhiyuan Honor Scholarship" _site/index.html
          grep -q "SynLogic" _site/index.html
          grep -q "SynLogic" _site/publications/index.html
          grep -q "Universal Truthfulness Hyperplane" _site/publications/index.html
          grep -q "jliugi@connect.ust.hk" _site/index.html
